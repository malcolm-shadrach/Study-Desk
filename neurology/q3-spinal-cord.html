<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinal Cord Anatomy Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #e8e6df;
    --muted: #7a7870;
    --accent: #c5a96e;
    --accent-dim: rgba(197,169,110,0.12);
    --accent-glow: rgba(197,169,110,0.25);
    --correct: #5db88a;
    --correct-bg: rgba(93,184,138,0.1);
    --wrong: #d9604a;
    --wrong-bg: rgba(217,96,74,0.1);
    --radius: 12px;
  }

  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(197,169,110,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(197,169,110,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(197,169,110,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container { width: 100%; max-width: 680px; position: relative; z-index: 1; }

  /* Header */
  .header { text-align: center; margin-bottom: 48px; }
  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 10px;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 32px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .progress-bar-bg {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #e8c97e);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  /* Score display */
  .score-display {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .score-display span {
    color: var(--accent);
    font-weight: 500;
  }

  /* Question card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1) both;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .q-category {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
    margin-bottom: 14px;
    margin-left: 10px;
  }
  .q-text {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--text);
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .option {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    text-align: left;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.3s ease both;
  }
  .option:nth-child(1) { animation-delay: 0.05s; }
  .option:nth-child(2) { animation-delay: 0.1s; }
  .option:nth-child(3) { animation-delay: 0.15s; }
  .option:nth-child(4) { animation-delay: 0.2s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .option:hover:not(:disabled) {
    border-color: var(--border-hover);
    background: #1e2330;
    transform: translateX(3px);
  }
  .option:disabled { cursor: default; transform: none; }

  .option-key {
    width: 26px; height: 26px;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.2s;
    background: var(--surface);
  }
  .option-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    flex: 1;
  }

  /* States */
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option.correct .option-key {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option.wrong .option-key {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .option.dimmed { opacity: 0.35; }

  /* Feedback box */
  .feedback {
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    animation: slideUp 0.3s ease both;
    margin-top: 4px;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: var(--correct-bg);
    border: 1px solid rgba(93,184,138,0.25);
    color: #a3dbbf;
  }
  .feedback.wrong-fb {
    background: var(--wrong-bg);
    border: 1px solid rgba(217,96,74,0.25);
    color: #e8a99e;
  }
  .feedback-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }
  .feedback.correct-fb .feedback-label { color: var(--correct); }
  .feedback.wrong-fb .feedback-label { color: var(--wrong); }

  /* Next button */
  .btn-next {
    display: none;
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 10px;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    margin-top: 4px;
    animation: slideUp 0.3s ease both;
  }
  .btn-next:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-next.show { display: block; }

  /* Results screen */
  .results {
    display: none;
    text-align: center;
    animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both;
  }
  .results.show { display: block; }
  .results-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 28px;
    background: var(--accent-dim);
    position: relative;
  }
  .results-score-ring::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(197,169,110,0.15);
  }
  .results-big {
    font-family: 'DM Serif Display', serif;
    font-size: 48px;
    color: var(--accent);
    line-height: 1;
  }
  .results-denom {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .results-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    margin-bottom: 10px;
  }
  .results-msg {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 380px;
    margin-left: auto; margin-right: auto;
  }
  .results-breakdown {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    text-align: left;
  }
  .breakdown-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .breakdown-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.5;
  }
  .breakdown-item:last-child { border-bottom: none; }
  .breakdown-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .dot-correct { background: var(--correct); }
  .dot-wrong   { background: var(--wrong); }
  .breakdown-q { color: var(--text); flex: 1; }
  .breakdown-a { color: var(--muted); font-size: 12px; }
  .btn-restart {
    padding: 14px 32px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 10px;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    letter-spacing: 0.03em;
  }
  .btn-restart:hover { background: var(--accent-dim); transform: translateY(-1px); }

  /* Question area switching */
  #quiz-area { width: 100%; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="eyebrow">Neuroanatomy</div>
    <h1>Spinal Cord <em>Anatomy</em></h1>
    <p class="subtitle">Test your knowledge — 12 questions across all sections</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="q-counter">Question 1 of 12</span>
      <span class="score-display">Score: <span id="score-live">0</span> / <span id="score-total">0</span></span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
  </div>

  <div id="quiz-area">
    <div class="card" id="q-card">
      <div style="display:flex;align-items:center">
        <div class="q-number" id="q-number">Q 01</div>
        <div class="q-category" id="q-category">Gray Horns</div>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
    </div>
    <div class="feedback" id="feedback">
      <span class="feedback-label" id="fb-label"></span>
      <span id="fb-text"></span>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Continue →</button>
  </div>

  <div class="results" id="results">
    <div class="results-score-ring">
      <div class="results-big" id="r-score">0</div>
      <div class="results-denom" id="r-denom">/ 12</div>
    </div>
    <div class="results-title" id="r-title">Quiz Complete</div>
    <div class="results-msg" id="r-msg"></div>
    <div class="results-breakdown" id="r-breakdown">
      <div class="breakdown-title">Question Review</div>
      <div id="breakdown-list"></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">↺ Restart Quiz</button>
  </div>
</div>

<script>
const questions = [
  {
    category: "Gray Horns",
    q: "What type of cell bodies are found in the anterior (ventral) gray horn, and what do they control?",
    options: [
      "Unmyelinated cell bodies of the somatic nervous system — control skeletal muscles",
      "Myelinated cell bodies of the autonomic nervous system — control smooth muscle",
      "Unipolar neurons that receive peripheral sensations",
      "Cell bodies that carry pain and temperature signals"
    ],
    answer: 0,
    explanation: "The anterior gray horn contains unmyelinated cell bodies of the somatic nervous system. Their axons exit via the ventral ramus to supply skeletal muscles."
  },
  {
    category: "Gray Horns",
    q: "What is the function of the posterior (dorsal) gray horn?",
    options: [
      "Sends motor commands out to skeletal muscles",
      "Acts as a relay for autonomic signals to smooth muscle",
      "Receives incoming peripheral sensory signals",
      "Stores cerebrospinal fluid"
    ],
    answer: 2,
    explanation: "The posterior gray horn contains cell bodies that pick up peripheral sensations. Sensory fibers travel from the dorsal root ganglion into the posterior horn."
  },
  {
    category: "Gray Horns",
    q: "What runs through the central canal of the spinal cord?",
    options: [
      "Blood vessels and fat",
      "Cerebrospinal fluid (CSF)",
      "Myelinated sensory fibers",
      "Bridging veins"
    ],
    answer: 1,
    explanation: "The central canal, located at the central commissure between the gray horns, carries cerebrospinal fluid (CSF)."
  },
  {
    category: "White Columns",
    q: "Which white column carries pain and temperature pathways?",
    options: [
      "Anterior white column",
      "Dorsal white column",
      "Lateral white column",
      "Central white column"
    ],
    answer: 2,
    explanation: "The lateral white column carries pain and temperature pathways. The anterior carries touch and pressure; the dorsal carries proprioception and fine discriminative touch."
  },
  {
    category: "White Columns",
    q: "Proprioception and fine discriminative touch are carried by which white column?",
    options: [
      "Lateral white column",
      "Dorsal (posterior) white column",
      "Anterior white column",
      "Ventral white column"
    ],
    answer: 1,
    explanation: "The dorsal (posterior) white column carries proprioception and fine discriminative touch, while the lateral carries pain/temperature and anterior carries touch/pressure."
  },
  {
    category: "White Columns",
    q: "The anterior white column is specifically responsible for carrying which sensory modalities?",
    options: [
      "Pain and temperature",
      "Proprioception and vibration",
      "Touch and pressure",
      "Fine discriminative touch only"
    ],
    answer: 2,
    explanation: "The anterior white column carries touch and pressure pathways. Pain and temperature travel in the lateral column, and proprioception travels in the dorsal column."
  },
  {
    category: "Meninges",
    q: "Starting from the spinal cord surface and moving outward, what is the correct order of the meningeal layers and spaces?",
    options: [
      "Dura mater → Epidural space → Arachnoid mater → Subarachnoid space → Pia mater",
      "Pia mater → Subarachnoid space → Arachnoid mater → Subdural space → Dura mater",
      "Arachnoid mater → Pia mater → Subdural space → Dura mater → Epidural space",
      "Pia mater → Epidural space → Arachnoid mater → Dura mater → Subarachnoid space"
    ],
    answer: 1,
    explanation: "From inside out: Pia mater (adheres to cord) → Subarachnoid space (CSF) → Arachnoid mater → Subdural space (bridging veins) → Meningeal dura → Epidural space (fat & vessels) → Periosteal dura (at bone)."
  },
  {
    category: "Meninges",
    q: "The epidural space lies between which two structures and what does it contain?",
    options: [
      "Between pia mater and arachnoid mater; contains CSF",
      "Between arachnoid mater and meningeal dura; contains bridging veins",
      "Between the two layers of the dura mater; contains fat and blood vessels",
      "Between the meningeal dura and bone; contains CSF"
    ],
    answer: 2,
    explanation: "The epidural space lies between the meningeal layer and the periosteal layer of the dura mater, and it contains fat and blood vessels. It is the target for epidural anesthesia."
  },
  {
    category: "Meninges",
    q: "Where is CSF found within the meningeal layers, and which membrane directly contacts it?",
    options: [
      "In the subdural space; the dura mater contacts it",
      "In the epidural space; the periosteal dura contacts it",
      "In the subarachnoid space; the arachnoid mater borders it",
      "In the central canal only; the pia mater contacts it"
    ],
    answer: 2,
    explanation: "CSF runs through the subarachnoid space. The arachnoid mater forms its outer boundary; the pia mater forms its inner boundary. CSF also flows through the central canal."
  },
  {
    category: "Nerve Roots",
    q: "What type of neurons are housed in the dorsal root ganglion, and what is their role?",
    options: [
      "Multipolar motor neurons that send signals to skeletal muscles",
      "Unipolar (first-order) neurons that relay sensory signals from the periphery to the posterior gray horn",
      "Bipolar neurons that carry pain and temperature to the anterior horn",
      "Autonomic neurons controlling visceral organs"
    ],
    answer: 1,
    explanation: "The dorsal root ganglion contains unipolar (first-order) neurons. They receive peripheral sensory input and relay it into the posterior gray horn of the spinal cord."
  },
  {
    category: "Nerve Roots",
    q: "Motor fibers from the anterior gray horn exit the spinal cord via which structure?",
    options: [
      "Dorsal root ganglion",
      "Dorsal ramus",
      "Ventral ramus",
      "Transverse foramen"
    ],
    answer: 2,
    explanation: "The ventral ramus carries somatic motor fibers outward from the anterior gray horn to supply skeletal muscles. The dorsal ramus exits posteriorly."
  },
  {
    category: "Vertebral Arteries",
    q: "The vertebral arteries travel through which opening in the cervical vertebrae, and what do they ultimately form?",
    options: [
      "Intervertebral foramen; they form the internal carotid arteries",
      "Spinal canal; they form the anterior spinal artery",
      "Transverse foramen; they fuse to form the basilar artery",
      "Vertebral notch; they form the posterior spinal arteries"
    ],
    answer: 2,
    explanation: "The vertebral arteries run upward through the transverse foramen of the cervical vertebrae, then fuse to form the basilar artery, which feeds the posterior portion of the Circle of Willis."
  }
];

let current = 0, score = 0, answered = false;
const results = [];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let shuffled = [];

function startQuiz() {
  shuffled = shuffle([...questions]);
  current = 0; score = 0;
  results.length = 0;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = shuffled[current];
  const n = current + 1;

  document.getElementById('q-number').textContent = `Q ${String(n).padStart(2,'0')}`;
  document.getElementById('q-category').textContent = q.category;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-counter').textContent = `Question ${n} of ${shuffled.length}`;
  document.getElementById('score-live').textContent = score;
  document.getElementById('score-total').textContent = current;
  document.getElementById('progress-fill').style.width = `${((current) / shuffled.length) * 100}%`;

  const feedback = document.getElementById('feedback');
  const btnNext = document.getElementById('btn-next');
  feedback.className = 'feedback';
  btnNext.className = 'btn-next';

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  const keys = ['A','B','C','D'];
  const opts = q.options.map((text, i) => ({ text, i }));

  opts.forEach(({ text, i }, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-key">${keys[idx]}</span><span class="option-text">${text}</span>`;
    btn.onclick = () => selectAnswer(i, btn, q);
    optionsEl.appendChild(btn);
  });

  // Animate card in
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'slideUp 0.4s cubic-bezier(0.4,0,0.2,1) both';
}

function selectAnswer(chosenIdx, btn, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.option');
  const isCorrect = chosenIdx === q.answer;

  allBtns.forEach((b, idx) => {
    b.disabled = true;
    const optIdx = parseInt(b.dataset.optIdx);
    // find which original index this button maps to
  });

  // Map buttons back to original indices
  const optEls = document.querySelectorAll('.option');
  const opts = q.options.map((text, i) => i);

  // Re-derive the mapping by reading button text
  optEls.forEach((b) => {
    b.disabled = true;
    const bText = b.querySelector('.option-text').textContent;
    const bIdx = q.options.indexOf(bText);
    if (bIdx === q.answer) {
      b.classList.add('correct');
    } else if (bText === btn.querySelector('.option-text').textContent && !isCorrect) {
      b.classList.add('wrong');
    } else {
      b.classList.add('dimmed');
    }
  });

  if (isCorrect) score++;

  results.push({ q: q.q, correct: isCorrect, answer: q.options[q.answer] });

  const feedback = document.getElementById('feedback');
  const fbLabel = document.getElementById('fb-label');
  const fbText = document.getElementById('fb-text');
  fbLabel.textContent = isCorrect ? '✓ Correct' : '✗ Incorrect';
  fbText.textContent = q.explanation;
  feedback.className = `feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;

  document.getElementById('score-live').textContent = score;
  document.getElementById('score-total').textContent = current + 1;

  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = current + 1 < shuffled.length ? 'Continue →' : 'See Results →';
  btnNext.className = 'btn-next show';
}

function nextQuestion() {
  current++;
  if (current >= shuffled.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';

  const pct = score / shuffled.length;
  let title, msg;
  if (pct === 1)      { title = "Perfect Score!"; msg = "Flawless. You've mastered every corner of spinal cord anatomy. Outstanding work."; }
  else if (pct >= .8) { title = "Excellent Work"; msg = "Strong performance across all sections. Review the few you missed and you'll have this locked in."; }
  else if (pct >= .6) { title = "Good Progress"; msg = "You've got a solid foundation. Revisit the meninges and white column pathways for a complete picture."; }
  else                { title = "Keep Practicing"; msg = "Anatomy takes repetition. Go back to your notes, focus on the weak areas, then try again."; }

  document.getElementById('r-score').textContent = score;
  document.getElementById('r-denom').textContent = `/ ${shuffled.length}`;
  document.getElementById('r-title').textContent = title;
  document.getElementById('r-msg').textContent = msg;

  const list = document.getElementById('breakdown-list');
  list.innerHTML = '';
  results.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'breakdown-item';
    d.innerHTML = `
      <div class="breakdown-dot ${r.correct ? 'dot-correct' : 'dot-wrong'}"></div>
      <div>
        <div class="breakdown-q">Q${i+1}: ${r.q}</div>
        ${!r.correct ? `<div class="breakdown-a">Answer: ${r.answer}</div>` : ''}
      </div>`;
    list.appendChild(d);
  });

  const resultsEl = document.getElementById('results');
  resultsEl.className = 'results show';
}

function restartQuiz() {
  document.getElementById('results').className = 'results';
  document.getElementById('quiz-area').style.display = '';
  document.querySelector('.progress-wrap').style.display = '';
  startQuiz();
}

startQuiz();
</script>
